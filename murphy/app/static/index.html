<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>murphy</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; color: #1c1c1c; background: #fff; }
  h1 { margin: 0; } h2 { font-size: 1.05rem; margin: 1.5rem 0 .4rem; }
  label { display: inline-block; margin: 0 12px 8px 0; font-size: .9rem; }
  input, select, button { font: inherit; padding: 4px 6px; }
  .verdict { font-size: 1.5rem; font-weight: 700; margin: 1rem 0 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #ddd; white-space: nowrap; }
  tr.best { font-weight: 700; }
  .muted, .note { color: #555; font-size: .88rem; }
  .error { color: #a00; }
  ul { padding-left: 20px; }
  button.link { background: none; border: 0; padding: 0; color: #0645ad; text-decoration: underline; cursor: pointer; }
  .questions button { margin: 0 8px 8px 0; }
  .evidence li { font-size: .85rem; word-break: break-word; }
</style>
</head>
<body>
<h1>murphy</h1>
<p class="muted">Will your flight get you there by your deadline? A replay of 2025 flights. You decide.</p>

<form id="find">
  <label>Date <input id="date" type="date" min="2025-01-01" max="2025-12-31" required></label>
  <label>Airline <input id="carrier" size="3" maxlength="2" placeholder="DL" required></label>
  <label>Flight <input id="number" type="number" min="1" placeholder="1222" required></label>
  <button>Find</button>
</form>
<div id="found"></div>
<p class="muted">Or try a high-risk flight: <span id="examples"></span></p>

<div id="controls" hidden>
  <label>Forecast made <select id="lead"><option value="24">24 h before</option><option value="6">6 h before</option><option value="2" selected>2 h before</option></select></label>
  <label>Deadline after scheduled arrival <select id="deadline"><option>30</option><option selected>60</option><option>120</option></select> min</label>
  <label>Could leave up to <input id="earlier" type="number" min="0" max="24" step="1" value="2" style="width:3.5em"> h earlier</label>
  <label>Sort by <select id="sort"><option value="chance">chance of making it</option><option value="price">estimated price</option></select></label>
</div>
<div id="result"></div>

<script>
const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const pct = x => (100 * x).toFixed(0) + "%";
const time = t => t ? t.slice(0, 2) + ":" + t.slice(2) : "?";
const WORDS = {
  keep: "Keep your flight",
  too_uncertain: "Too uncertain to say",
  consider_changing: "Consider changing",
  at_risk_no_better_flight: "High risk, but no flight is clearly better",
  cancelled: "This flight is already known to be cancelled",
};
let current = null;
const QUESTIONS = [  // murphy.graphrag.QUESTIONS (0019)
  ["chance", "How likely is this flight to make me late?"],
  ["better", "Is there a better flight?"],
  ["why", "Why is this flight at risk?"],
  ["region", "How are the regions doing today?"],
];
const STATUS = {
  not_in_graph: "Questions cover flights from 4 to 12 January 2025 only.",
  no_evidence: "The knowledge graph holds nothing for this question, so there is nothing to explain.",
  paused: "Explanations are paused: the language model's free daily limit is reached. The evidence below comes straight from the knowledge graph.",
};

function show(v) { return Array.isArray(v) ? v.map(x => typeof x === "object" ? JSON.stringify(x) : x).join(", ") : v; }

async function ask(key, box) {
  box.replaceChildren(el("p", "Looking in the knowledge graph...", "muted"));
  const q = new URLSearchParams({ flight_id: current, question: key, lead_h: $("lead").value, deadline_min: $("deadline").value, max_earlier_h: $("earlier").value });
  let d;
  try { d = await get("/api/ask?" + q); } catch (e) { box.replaceChildren(el("p", e.message, "error")); return; }
  const out = [el("p", d.question, "muted")];
  out.push(el("p", d.explanation || STATUS[d.status]));
  if (d.checks && d.checks.invented.length) out.push(el("p", "Check: these numbers are not in the evidence: " + d.checks.invented.join(", "), "error"));
  if (d.checks && d.checks.bad_tags.length) out.push(el("p", "Check: it cites evidence that does not exist: " + d.checks.bad_tags.join(", "), "error"));
  if (d.evidence.length) {
    const det = el("details"), ul = el("ul", null, "evidence");
    det.append(el("summary", `See the evidence (${d.evidence.length} rows)`));
    d.evidence.forEach(r => ul.append(el("li", `[${r.tag}] ${r.query}: ` + Object.entries(r).filter(([k]) => k !== "tag" && k !== "query").map(([k, v]) => `${k} ${show(v)}`).join("; "))));
    det.append(ul);
    det.append(el("p", `From queries ${d.provenance.queries.join(", ")} on ${d.provenance.graph}. Explained by ${d.provenance.llm}, which computes no number. Decision records: ${d.provenance.decisions.join(", ")}.`, "note"));
    out.push(det);
  }
  box.replaceChildren(...out);
}

async function get(url) {
  const r = await fetch(url);
  const body = await r.json();
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : "Request failed");
  return body;
}

function table(headers, rows) {
  const wrap = el("div", null, "scroll"), t = el("table"), head = el("tr");
  headers.forEach(h => head.append(el("th", h)));
  t.append(head);
  rows.forEach(r => { const tr = el("tr", null, r.cls); r.cells.forEach(c => tr.append(el("td", c))); t.append(tr); });
  wrap.append(t);
  return wrap;
}

function choose(flightId) { current = flightId; $("controls").hidden = false; load(); }

async function load() {
  const out = $("result");
  const q = new URLSearchParams({ flight_id: current, lead_h: $("lead").value, deadline_min: $("deadline").value, max_earlier_h: $("earlier").value, sort: $("sort").value });
  try { render(await get("/api/trip?" + q)); }
  catch (e) { out.replaceChildren(el("p", e.message, "error")); }
}

function render(d) {
  const f = d.flight, a = d.answer, t = d.uncertainty.track_record, p = d.provenance, out = [];
  out.push(el("p", WORDS[a.verdict], "verdict"));
  out.push(el("p", `${f.flight}, ${f.origin} to ${f.dest}, ${f.date}, ${time(f.departs_local)} to ${time(f.arrives_local)} local. Chance of making your deadline: ${pct(a.chance)}.`));

  out.push(el("h2", "How forecasts like this have done"));
  out.push(el("p", `On 2025, ${t.forecasts.toLocaleString("en-US")} forecasts in this risk band predicted a ${pct(t.predicted_miss)} chance of missing on average. ${pct(t.true_miss)} really missed.`));

  if (a.verdict !== "keep") {
    out.push(el("h2", `Alternatives (${d.alternatives.length})`));
    if (d.alternatives.length) {
      out.push(table(["", "Flight", "Departs", "Arrives", "Chance", "Gain", "Estimated new ticket"], d.alternatives.map(x => ({
        cls: x.best ? "best" : "",
        cells: [x.best ? "Best" : "", x.flight, `${x.date} ${time(x.departs_local)}`, time(x.arrives_local), pct(x.chance), (x.gain >= 0 ? "+" : "") + (100 * x.gain).toFixed(0) + " pts",
                x.cost.fare == null ? "No estimate" : "$" + x.cost.fare.toFixed(2) + (x.same_airline ? " *" : "")],
      }))));
      out.push(el("p", "Estimated new ticket: the median fare people paid on this route and airline (or route, if the airline has too little data), from " + d.alternatives[0].cost.source + ". Flights on one airline show the same figure, so sorting by price compares airlines, not departure times.", "note"));
      if (d.alternatives.some(x => x.same_airline)) out.push(el("p", "* Same airline: this may cost only a fare difference, which the data does not show.", "note"));
    } else out.push(el("p", "No flight leaves within your limits and arrives by the deadline.", "muted"));
  }

  out.push(el("h2", "Ask about this flight"));
  if ($("deadline").value !== "60") out.push(el("p", "Questions use a 60-minute deadline. Set the deadline to 60 to ask.", "muted"));
  else {
    const qs = el("div", null, "questions"), answer = el("div");
    QUESTIONS.forEach(([key, text]) => { const b = el("button", text); b.type = "button"; b.onclick = () => ask(key, answer); qs.append(b); });
    out.push(qs, answer);
  }

  out.push(el("h2", "Where this came from"));
  out.push(el("p", `Model ${p.model}, forecast as of ${p.forecast_as_of_utc} UTC (${p.lead_h} h before departure). ${p.data}. Flight record ${f.flight_id}. Decision records: ${p.decisions.join(", ")}.`, "note"));

  out.push(el("h2", "Limits"));
  const ul = el("ul", null, "note");
  d.uncertainty.limits.forEach(x => ul.append(el("li", x)));
  out.push(ul);
  $("result").replaceChildren(...out);
}

$("find").addEventListener("submit", async e => {
  e.preventDefault();
  const q = new URLSearchParams({ date: $("date").value, carrier: $("carrier").value, number: $("number").value });
  const box = $("found");
  try {
    const rows = await get("/api/flights?" + q);
    if (!rows.length) { box.replaceChildren(el("p", "No forecast for this flight. Forecasts cover sampled 2025 flights only.", "error")); return; }
    if (rows.length === 1) { box.replaceChildren(); choose(rows[0].flight_id); return; }
    box.replaceChildren(...rows.map(r => { const b = el("button", `${r.origin} to ${r.dest}, ${time(r.crs_dep_local)}`); b.type = "button"; b.onclick = () => choose(r.flight_id); return b; }));
  } catch (err) { box.replaceChildren(el("p", err.message, "error")); }
});
const linked = new URLSearchParams(location.search).get("flight_id");
if (linked) choose(linked);
["lead", "deadline", "earlier", "sort"].forEach(id => $(id).addEventListener("change", load));

get("/api/examples").then(rows => $("examples").replaceChildren(...rows.flatMap(r => {
  const b = el("button", `${r.flight} ${r.origin}-${r.dest} ${r.date}`, "link");
  b.type = "button"; b.onclick = () => choose(r.flight_id);
  return [b, document.createTextNode("  ")];
})));
</script>
</body>
</html>
